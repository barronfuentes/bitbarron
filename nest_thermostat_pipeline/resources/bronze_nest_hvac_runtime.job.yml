# Job: Bronze Nest HVAC Runtime Ingestion
# Reads CSV-quoted JSONL files from a landing volume and writes a bronze Delta table.

resources:
  jobs:
    bronze_nest_hvac_runtime:
      name: bronze_nest_hvac_runtime

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: bronze_table
          default: ${var.bronze_table}
        - name: volume_path
          default: ${var.volume_path}

      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ../src/bronze_nest_hvac_runtime.ipynb
            base_parameters:
              catalog: '{{job.parameters.catalog}}'
              schema: '{{job.parameters.schema}}'
              bronze_table: '{{job.parameters.bronze_table}}'
              volume_path: '{{job.parameters.volume_path}}'

      environments:
        - environment_key: default
          spec:
            environment_version: "4"