[project]
name = "column_sync"
version = "0.1.0"
description = "a CLI tool that reads the data dictionary from `college_scorecard_pipeline/metadata/data.yaml` and programmatically updates column descriptions (comments) in Databricks Unity Catalog via the Databricks SDK."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "databricks-sdk>=0.82.0",
    "PyYAML>=6.0",
]

authors = [{ name = "barronfuentes@gmail.com" }]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
column-sync = "column_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/column_sync"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require live Databricks access",
]
