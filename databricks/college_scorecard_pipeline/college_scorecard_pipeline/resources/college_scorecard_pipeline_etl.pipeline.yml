# The main pipeline for college_scorecard_pipeline

resources:
  pipelines:
    college_scorecard_pipeline_etl:
      name: college_scorecard_pipeline_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/college_scorecard_pipeline_etl"

      libraries:
        - glob:
            include: ../src/college_scorecard_pipeline_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
